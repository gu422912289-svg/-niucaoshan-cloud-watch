name: Cloud Sea Forecast Snapshots
on:
  schedule:
    # Beijing time around 08:10 and 20:10 (UTC schedule; may be delayed)
    - cron: '10 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudsea-snapshot-default
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and archive forecast data
        id: collect
        continue-on-error: true
        run: python scripts/collect.py --days 4 --output snapshots
      - name: Calculate and freeze offline evaluation scores
        id: score
        continue-on-error: true
        run: python scripts/score.py --input snapshots --output scores
      - name: Commit snapshot and score files (even partially complete)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p snapshots scores
          git add snapshots/ scores/
          if ! git diff --cached --quiet; then
            git commit -m "archive: weather and score snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No files to commit"
          fi
      - name: Report collector or scoring failures
        if: steps.collect.outcome == 'failure' || steps.score.outcome == 'failure'
        run: |
          echo 'One or more archive steps failed; partial outputs were committed.' >&2
          exit 1
