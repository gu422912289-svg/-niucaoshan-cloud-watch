name: Cloud Sea Spatial Research
on:
  workflow_dispatch:
  schedule:
    # Beijing 08:25 daily; this is separate from the verified V1.1 archive.
    - cron: '25 0 * * *'
permissions:
  contents: write
concurrency:
  group: cloudsea-spatial-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect spatial model-grid experiment
        id: spatial
        continue-on-error: true
        run: python scripts/spatial_probe.py --site taizijian --days 4 --out research/spatial
      - name: Preserve independent research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/spatial/
          if ! git diff --cached --quiet; then
            git commit -m "research: spatial model grid $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - name: Surface API errors
        if: steps.spatial.outcome == 'failure'
        run: exit 1
